---
name: Fork release
# yamllint disable-line rule:truthy

# The upstream Release workflow publishes to npm with semantic-release. This
# fork is installed by the Home Assistant Node-RED add-on from a tarball
# attached to a GitHub release instead, since installing from git does not
# build dist/. Pushing a tag vX.Y.Z builds, tests and releases that version.

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: yarn
      - name: Run install
        uses: borales/actions-yarn@v5.0.0
        with:
          cmd: install --immutable
      - name: Format
        run: yarn run format --check
      - name: Lint
        run: yarn run lint
      - name: Test
        # yarn test only picks up *.test.js; run the TypeScript tests as well
        env:
          TZ: Europe/Stockholm
        run: yarn vitest run
      - name: Build
        run: yarn run build
      - name: Pack
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"
          npm pack
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" ./*.tgz --generate-notes
