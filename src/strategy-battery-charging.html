<script type="text/javascript">
  RED.nodes.registerType('enell-strategy-genetic-charging-seasonal', {
    category: 'Power Saver',
    color: '#a6bbcf',
    defaults: {
      name: { value: '' },
      populationSize: {
        value: 20,
        required: true,
        validate: RED.validators.number(),
      },
      generations: {
        value: 400,
        required: true,
        validate: RED.validators.number(),
      },
      mutationRate: {
        value: 3,
        required: true,
        validate: RED.validators.number(),
      },
      numberOfPricePeriods: {
        value: 8,
        required: true,
        validate: RED.validators.number(),
      },
      batteryMaxEnergy: {
        value: 5,
        required: true,
        validate: RED.validators.number(),
      },
      batteryMaxInputPower: {
        value: 2.5,
        required: true,
        validate: RED.validators.number(),
      },
      batteryMaxOutputPower: {
        value: 2.5,
        required: true,
        validate: RED.validators.number(),
      },
      averageConsumption: {
        value: 1.5,
        required: true,
        validate: RED.validators.number(),
      },
      batteryIdleLoss: {
        value: 0,
        required: true,
        default: 0,
        validate: RED.validators.number(),
      },
      restrictChargingEnabled: { value: false },
      restrictionStartDate: {
        value: '11-01',
        validate: RED.validators.regex(/^(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/),
      },
      restrictionEndDate: {
        value: '03-31',
        validate: RED.validators.regex(/^(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/),
      },
      restrictionStartTime: {
        value: '07:00',
        validate: RED.validators.regex(/^([01]\d|2[0-3]):[0-5]\d$/),
      },
      restrictionEndTime: {
        value: '20:00',
        validate: RED.validators.regex(/^([01]\d|2[0-3]):[0-5]\d$/),
      },
      allowWeekends: { value: true },
    },
    inputs: 1,
    outputs: 1,
    icon: 'font-awesome/fa-battery',
    label: function () {
      return this.name || 'Battery charging schedule';
    },
    oneditprepare: function () {
      const toggle = () =>
        $('.restriction-field').prop(
          'disabled',
          !$('#node-input-restrictChargingEnabled').is(':checked')
        );
      $('#node-input-restrictChargingEnabled').on('change', toggle);
      toggle();
    },
  });
</script>

<script type="text/html" data-template-name="enell-strategy-genetic-charging-seasonal">
  <div class="form-row">
    <label for="node-input-name" style="width: 240px"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <h3>Energy settings</h3>
  <div class="form-row">
    <label for="node-input-batteryMaxEnergy" style="width: 240px">Battery capacity (kWh)</label>
    <input type="text" id="node-input-batteryMaxEnergy" />
  </div>

  <div class="form-row">
    <label for="node-input-batteryMaxInputPower" style="width: 240px"
      >Max battery input power (kW)</label
    >
    <input type="text" id="node-input-batteryMaxInputPower" />
  </div>

  <div class="form-row">
    <label for="node-input-averageConsumption" style="width: 240px"
      >Average consumption per hour (kW)</label
    >
    <input type="text" id="node-input-averageConsumption" />
  </div>
  <div class="form-row">
    <label for="node-input-batteryIdleLoss" style="width: 240px">Battery idle loss (kWh/h)</label>
    <input type="text" id="node-input-batteryIdleLoss" />
  </div>
  <h3>Genetic algorithm</h3>
  <div class="form-row">
    <label for="node-input-populationSize" style="width: 240px">Population size</label>
    <input type="text" id="node-input-populationSize" />
  </div>

  <div class="form-row">
    <label for="node-input-generations" style="width: 240px">Number of generations</label>
    <input type="text" id="node-input-generations" />
  </div>

  <div class="form-row">
    <label for="node-input-mutationRate" style="width: 240px">Mutation chance (%)</label>
    <input type="text" id="node-input-mutationRate" />
  </div>

  <div class="form-row">
    <label for="node-input-numberOfPricePeriods" style="width: 240px"
      >Number of charging/discharging periods</label
    >
    <input type="text" id="node-input-numberOfPricePeriods" />
  </div>
  <h3>Grid charging restriction</h3>
  <div class="form-row">
    <label for="node-input-restrictChargingEnabled" style="width: 240px">Enable restriction</label>
    <input type="checkbox" id="node-input-restrictChargingEnabled" style="width: auto" />
  </div>
  <div class="form-row">
    <label for="node-input-restrictionStartDate" style="width: 240px">Season start (MM-DD)</label>
    <input type="text" id="node-input-restrictionStartDate" class="restriction-field" />
  </div>
  <div class="form-row">
    <label for="node-input-restrictionEndDate" style="width: 240px">Season end (MM-DD)</label>
    <input type="text" id="node-input-restrictionEndDate" class="restriction-field" />
  </div>
  <div class="form-row">
    <label for="node-input-restrictionStartTime" style="width: 240px">Daily start (HH:mm)</label>
    <input type="text" id="node-input-restrictionStartTime" class="restriction-field" />
  </div>
  <div class="form-row">
    <label for="node-input-restrictionEndTime" style="width: 240px">Daily end (HH:mm)</label>
    <input type="text" id="node-input-restrictionEndTime" class="restriction-field" />
  </div>
  <div class="form-row">
    <label for="node-input-allowWeekends" style="width: 240px">Allow charging on weekends</label>
    <input
      type="checkbox"
      id="node-input-allowWeekends"
      class="restriction-field"
      style="width: auto"
    />
  </div>
</script>

<script type="text/html" data-help-name="enell-strategy-genetic-charging-seasonal">
  <p>
    A strategy addon for powersaver to calculate the optimal batter charging schedule using genetic
    algorithms
  </p>
  <p>
    With the grid charging restriction enabled, the battery is never scheduled to charge from the
    grid between the daily start and end time within the season (for example a power tariff on
    weekdays 07:00-20:00, November to March). A charging period that would cross into that time is
    cut at the boundary, and the rest of it is reported as idle.
  </p>
</script>
